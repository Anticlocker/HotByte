<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  
  <title>Ratings & Reviews - HotByte Admin</title>
  
  <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 280px;
      --primary: #FF5A1F;
      --primary-dark: #E04A10;
      --sidebar-bg: #111111;
      --sidebar-border: rgba(255,255,255,0.05);
      --card-bg: #FFFFFF;
      --card-border: rgba(0,0,0,0.06);
      --body-bg: #F8F9FA;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--body-bg); color: #1a1a1a; }

    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      z-index: 1000;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .sidebar-header { padding: 2.5rem 1.5rem; border-bottom: 1px solid var(--sidebar-border); }
    .sidebar-brand { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 12px; }
    
    .nav-btn { color: #888; padding: 1rem 1.5rem; font-weight: 600; margin: 4px 16px; border-radius: 14px; transition: var(--transition); display: flex; align-items: center; gap: 12px; text-decoration: none; width: calc(100% - 32px); font-size: 0.95rem; }
    .nav-btn:hover { color: #FFF; background: rgba(255,255,255,0.05); }
    .nav-btn.active { color: #FFF; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 10px 25px rgba(255, 90, 31, 0.3); }

    .main-content { margin-left: var(--sidebar-width); padding: 2rem; min-height: 100vh; transition: var(--transition); }
    
    .top-navbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 0.6rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .stat-card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border); padding: 1.5rem; transition: var(--transition); height: 100%; }
    .stat-card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.05); }
    .stat-icon-bg { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; margin-bottom: 1rem; }
    .bg-icon-warning { background: rgba(255, 193, 7, 0.1); color: #FFC107; }
    .bg-icon-success { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
    .bg-icon-info { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .bg-icon-primary { background: rgba(255, 90, 31, 0.1); color: #FF5A1F; }
    .stat-value { font-size: 1.75rem; font-weight: 800; color: #1a1a1a; margin-bottom: 0.25rem; }

    .ratings-table-container { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border); overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    .ratings-table thead th { background: #f8f9fa; padding: 1.2rem 1rem; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; border-bottom: 1px solid var(--card-border); }
    .ratings-table td { padding: 1.2rem 1rem; border-bottom: 1px solid #f1f3f5; vertical-align: middle; }
    .stars { color: #FFC107; font-size: 1.1rem; }

    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; display: none; }
    @media (max-width: 991px) { .sidebar { transform: translateX(-100%); } .sidebar.show { transform: translateX(0); } .main-content { margin-left: 0; } .overlay.show { display: block; } }
  </style>
</head>
<body>
  <div class="overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/admin" class="sidebar-brand">
        <div style="width:36px; height:36px; background:linear-gradient(135deg,#FF5A1F,#E04A10); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; box-shadow:0 4px 12px rgba(255,90,31,0.4);">
          <i class="fas fa-fire" style="font-size:1rem;"></i>
        </div>
        <span>Hot<span style="color:#FF5A1F">Byte</span></span>
      </a>
    </div>
    <div class="d-flex flex-column flex-grow-1 p-3 gap-2">
      <a href="/admin" class="nav-btn text-decoration-none"><i class="fas fa-receipt"></i> Orders</a>
      <a href="/admin?tab=menu" class="nav-btn text-decoration-none"><i class="fas fa-utensils"></i> Menu Items</a>
      <a href="/admin?tab=categories" class="nav-btn text-decoration-none"><i class="fas fa-tags"></i> Categories</a>
      <a href="/admin/ratings" class="nav-btn active text-decoration-none"><i class="fas fa-star"></i> Ratings & Reviews</a>
      <a href="/admin/users" class="nav-btn text-decoration-none"><i class="fas fa-users-cog"></i> Users & Reports</a>
      <a href="/admin/sales-report" class="nav-btn text-decoration-none"><i class="fas fa-chart-line"></i> Sales & Analytics</a>
      <a href="/admin/kitchen" class="nav-btn text-decoration-none" target="_blank"><i class="fas fa-utensils"></i> Kitchen Display</a>
      <a href="/admin/oldorders" class="nav-btn text-decoration-none"><i class="fas fa-history"></i> Old Orders</a>
      <a href="/admin/settings" class="nav-btn text-decoration-none"><i class="fas fa-cog"></i> Settings</a>
      <div class="mt-auto pt-3 border-top" style="border-color: var(--sidebar-border) !important;">
        <button class="nav-btn text-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-navbar">
      <div class="d-flex align-items-center">
        <button class="btn btn-link text-body d-lg-none me-3 p-0" onclick="toggleSidebar()"><i class="fas fa-bars fs-4"></i></button>
        <h5 class="m-0 fw-bold" style="font-family: 'Outfit', sans-serif;">Ratings & Reviews</h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center gap-3 ps-3 border-start" style="border-color: var(--sidebar-border) !important;">
          <div class="text-end d-none d-sm-block">
            <div class="fw-bold" style="font-size: 0.9rem; line-height: 1.2;" id="adminUsername">Admin</div>
            <div class="text-muted" style="font-size: 0.75rem;">Manager</div>
          </div>
          <div class="rounded-circle bg-primary-subtle d-flex align-items-center justify-content-center text-primary" style="width: 40px; height: 40px; flex-shrink: 0;">
            <i class="fas fa-user"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon-bg bg-icon-warning"><i class="fas fa-star"></i></div><div class="stat-value" id="totalRatings">0</div><div class="text-muted small fw-medium">Total Ratings</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon-bg bg-icon-success"><i class="fas fa-star-half-alt"></i></div><div class="stat-value" id="averageRating">0.0</div><div class="text-muted small fw-medium">Average Rating</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon-bg bg-icon-info"><i class="fas fa-calendar-day"></i></div><div class="stat-value" id="todayRatings">0</div><div class="text-muted small fw-medium">Today's Ratings</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon-bg bg-icon-primary"><i class="fas fa-comment"></i></div><div class="stat-value" id="withReview">0</div><div class="text-muted small fw-medium">With Reviews</div></div></div>
    </div>

    <div id="ratingsContainer">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Loading ratings...</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.all.min.js"></script>
  
  <script>
    let ratings = [];
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('mobileOverlay').classList.toggle('show');
    }
    async function checkAdminAuth() {
      try {
        const response = await fetch('/api/auth/admin/session-check');
        const data = await response.json();
        if (!data.authenticated) { window.location.href = '/admin/login'; return; }
        document.getElementById('adminUsername').textContent = data.admin.username;
        loadRatings();
      } catch (error) { window.location.href = '/admin/login'; }
    }
    async function loadRatings() {
      try {
        const response = await fetch('/api/admin/ratings');
        const data = await response.json();
        if (data.success) {
          ratings = data.ratings || [];
          displayRatings();
          updateStats(data.stats);
        } else {
          document.getElementById('ratingsContainer').innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        }
      } catch (error) {
        document.getElementById('ratingsContainer').innerHTML = `<div class="alert alert-danger">Failed to load ratings.</div>`;
      }
    }
    function displayRatings() {
      const container = document.getElementById('ratingsContainer');
      if (!ratings || ratings.length === 0) {
        container.innerHTML = `<div class="text-center py-5"><i class="fas fa-star fa-3x text-muted mb-3"></i><p class="text-muted">No ratings found</p></div>`;
        return;
      }

      const tableRows = ratings.map(rating => {
        let starsHtml = '';
        for(let i=1; i<=5; i++) {
          starsHtml += `<i class="${i <= rating.rating_value ? 'fas' : 'far'} fa-star"></i>`;
        }
        
        const date = new Date(rating.created_at).toLocaleString('en-IN', { 
          timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
        
        const itemInfo = rating.item_id ? `<div class="mt-1"><small class="text-muted"><i class="fas fa-utensils"></i> ${rating.item_name || 'Item'} ${rating.item_category ? `â€¢ ${rating.item_category}` : ''}</small></div>` : '';
        const orderIdDisplay = rating.order_id ? `<strong class="text-primary">#${rating.order_id}</strong>` : '-';

        return `
          <tr>
            <td><strong>#${rating.rating_id}</strong></td>
            <td><div><strong>${rating.customer_name}</strong></div><small class="text-muted">${rating.customer_phone}</small></td>
            <td class="text-center">${orderIdDisplay}</td>
            <td><span class="badge ${rating.item_id ? 'bg-primary-subtle text-primary' : 'bg-secondary-subtle text-secondary'}">${rating.item_id ? 'Item' : 'Order'}</span>${itemInfo}</td>
            <td><div class="stars">${starsHtml}</div><small class="text-muted">(${rating.rating_value}/5)</small></td>
            <td style="max-width: 300px;">${rating.review_text || '<em class="text-muted">No review</em>'}</td>
            <td class="small">${date}</td>
            <td class="text-center"><button class="btn btn-sm btn-outline-danger border-0" onclick="deleteRating(${rating.rating_id})"><i class="fas fa-trash"></i></button></td>
          </tr>`;
      }).join('');

      container.innerHTML = `
        <div class="ratings-table-container">
          <div class="table-responsive">
            <table class="table ratings-table mb-0">
              <thead>
                <tr>
                  <th>ID</th><th>Customer</th><th class="text-center">Order ID</th><th>Type</th><th>Rating</th><th>Review</th><th>Date</th><th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </div>
        </div>`;
    }

    function updateStats(stats) {
      if (!stats) return;
      document.getElementById('totalRatings').textContent = stats.totalRatings || 0;
      document.getElementById('averageRating').textContent = stats.averageRating || '0.0';
      document.getElementById('todayRatings').textContent = stats.todayRatings || 0;
      document.getElementById('withReview').textContent = stats.withReview || 0;
    }

    async function deleteRating(ratingId) {
      const result = await Swal.fire({ title: 'Delete Rating?', text: 'This cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Yes, Delete' });
      if (result.isConfirmed) {
        try {
          const response = await fetch(`/api/admin/ratings/${ratingId}`, { method: 'DELETE' });
          const data = await response.json();
          if (data.success) { loadRatings(); Swal.fire('Deleted!', '', 'success'); }
        } catch (error) { Swal.fire('Error', 'Failed to delete', 'error'); }
      }
    }
    async function logout() { await fetch('/api/auth/admin/logout', { method: 'POST' }); window.location.href = '/admin/login'; }
    checkAdminAuth();
  </script>
</body>
</html>
