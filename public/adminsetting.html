<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - HotByte Admin</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6.4 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 280px;
      --primary: #FF5A1F;
      --primary-dark: #E04A10;
      --bg-midnight: #111111;
      --sidebar-bg: #111111;
      --sidebar-border: rgba(255,255,255,0.05);
      --card-bg: #FFFFFF;
      --card-border: rgba(0,0,0,0.06);
      --body-bg: #F8F9FA;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body { font-family: 'Inter', sans-serif; background-color: var(--body-bg); color: #1a1a1a; }

    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      top: 0; left: 0;
      z-index: 1000;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .sidebar-header { padding: 2.5rem 1.5rem; border-bottom: 1px solid var(--sidebar-border); }
    .sidebar-brand { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 12px; }
    .nav-btn { color: #888; padding: 1rem 1.5rem; font-weight: 600; margin: 4px 16px; border-radius: 14px; transition: var(--transition); display: flex; align-items: center; gap: 12px; text-decoration: none; width: calc(100% - 32px); font-size: 0.95rem; }
    .nav-btn:hover { color: #FFF; background: rgba(255,255,255,0.05); }
    .nav-btn.active { color: #FFF; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 10px 25px rgba(255, 90, 31, 0.3); }

    .main-content { margin-left: var(--sidebar-width); padding: 2rem; min-height: 100vh; }
    .top-navbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: 20px; padding: 1rem 2rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }

    .settings-card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border); padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    .form-label { font-weight: 600; color: #4b5563; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .form-control { border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #e5e7eb; transition: var(--transition); }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 90, 31, 0.1); }
    .btn-primary-custom { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; color: white; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600; transition: var(--transition); }
    .btn-primary-custom:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 90, 31, 0.3); }

    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 999; display: none; }
    @media (max-width: 991px) { .sidebar { transform: translateX(-100%); } .sidebar.show { transform: translateX(0); } .main-content { margin-left: 0; } .overlay.show { display: block; } }
  </style>
</head>
<body>
  <div class="overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/admin" class="sidebar-brand">
        <div style="width:36px; height:36px; background:linear-gradient(135deg,#FF5A1F,#E04A10); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; box-shadow:0 4px 12px rgba(255,90,31,0.4);">
          <i class="fas fa-fire"></i>
        </div>
        <span>Hot<span style="color:#FF5A1F">Byte</span></span>
      </a>
    </div>
    <div class="d-flex flex-column flex-grow-1 p-3 gap-2">
      <a href="/admin" class="nav-btn text-decoration-none"><i class="fas fa-receipt"></i> Orders</a>
      <a href="/admin?tab=menu" class="nav-btn text-decoration-none"><i class="fas fa-utensils"></i> Menu Items</a>
      <a href="/admin?tab=categories" class="nav-btn text-decoration-none"><i class="fas fa-tags"></i> Categories</a>
      <a href="/admin/ratings" class="nav-btn text-decoration-none"><i class="fas fa-star"></i> Ratings & Reviews</a>
      <a href="/admin/users" class="nav-btn text-decoration-none"><i class="fas fa-users-cog"></i> Users & Reports</a>
      <a href="/admin/sales-report" class="nav-btn text-decoration-none"><i class="fas fa-chart-line"></i> Sales & Analytics</a>
      <a href="/admin/kitchen" class="nav-btn text-decoration-none" target="_blank"><i class="fas fa-utensils"></i> Kitchen Display</a>
      <a href="/admin/oldorders" class="nav-btn text-decoration-none"><i class="fas fa-history"></i> Old Orders</a>
      <a href="/admin/settings" class="nav-btn active text-decoration-none"><i class="fas fa-cog"></i> Settings</a>
      <div class="mt-auto pt-3 border-top" style="border-color: var(--sidebar-border) !important;">
        <button class="nav-btn text-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-navbar">
      <div class="d-flex align-items-center">
        <button class="btn btn-link text-body d-lg-none me-3 p-0" onclick="toggleSidebar()"><i class="fas fa-bars fs-4"></i></button>
        <h5 class="m-0 fw-bold" style="font-family: 'Outfit', sans-serif;">Admin Settings</h5>
      </div>
      <div class="d-flex align-items-center gap-3 ps-3 border-start">
        <div class="text-end d-none d-sm-block">
          <div class="fw-bold" id="adminUsername" style="font-size: 0.9rem; line-height: 1.2;">Admin</div>
          <div class="text-muted" style="font-size: 0.75rem;">Manager</div>
        </div>
        <div class="rounded-circle bg-primary-subtle d-flex align-items-center justify-content-center text-primary" style="width: 40px; height: 40px;"><i class="fas fa-user"></i></div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="settings-card">
          <h5 class="fw-bold mb-4"><i class="fas fa-lock me-2 text-primary"></i> Change Password</h5>
          <form id="changePasswordForm">
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" id="currentPassword" required>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" id="newPassword" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirmNewPassword" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 mt-2">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.all.min.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('mobileOverlay').classList.toggle('show');
    }
    async function checkAdminAuth() {
      try {
        const response = await fetch('/api/auth/admin/session-check');
        const data = await response.json();
        if (!data.authenticated) { window.location.href = '/admin/login'; return; }
        document.getElementById('adminUsername').textContent = data.admin.username;
      } catch (error) { window.location.href = '/admin/login'; }
    }
    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      if (newPassword !== confirmNewPassword) { Swal.fire('Error', 'New passwords do not match', 'error'); return; }
      try {
        const response = await fetch('/api/auth/admin/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword, confirmNewPassword })
        });
        const data = await response.json();
        if (data.success) {
          Swal.fire({ icon: 'success', title: 'Updated', text: 'Password changed successfully', timer: 2000, showConfirmButton: false });
          e.target.reset();
        } else { Swal.fire('Error', data.message || 'Failed to update', 'error'); }
      } catch (error) { Swal.fire('Error', 'An error occurred', 'error'); }
    });
    async function logout() { await fetch('/api/auth/admin/logout', { method: 'POST' }); window.location.href = '/admin/login'; }
    checkAdminAuth();
  </script>
</body>
</html>
